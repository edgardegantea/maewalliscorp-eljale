name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Build del frontend ──────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: el-jale-frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: el-jale-frontend
        run: npm ci

      - name: Build frontend (producción)
        working-directory: el-jale-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STORAGE_URL: ${{ secrets.VITE_STORAGE_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

      # ── 2. Deploy al VPS ───────────────────────────────────────────
      - name: Deploy al servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /var/www/maewalliscorp.org/eljaleback/maewalliscorp-eljale

            # Corregir permisos si es necesario
            sudo chown -R deployer:deployer . 2>/dev/null || true

            # Pull del código
            git checkout -- el-jale-api/composer.lock 2>/dev/null || true
            git pull origin main

            # Backend
            cd el-jale-api
            composer install --no-dev --optimize-autoloader --ignore-platform-req=php --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "✅ Deploy completado: $(date)"

      # ── 3. Subir dist al VPS ───────────────────────────────────────
      - name: Sincronizar dist al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'el-jale-frontend/dist/*'
          target: '/var/www/maewalliscorp.org/eljaleback/maewalliscorp-eljale/el-jale-frontend/dist/'
          strip_components: 2
          overwrite: true

      # ── 4. Notificar resultado ─────────────────────────────────────
      - name: Notificar deploy exitoso
        if: success()
        run: echo "🚀 Deploy a producción completado exitosamente"

      - name: Notificar fallo
        if: failure()
        run: echo "❌ El deploy falló — revisar logs"
